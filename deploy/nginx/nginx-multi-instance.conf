# Nginx config template for Nanobot multi-instance
# Copy one block per instance, change port and auth

# Instance: alice (port 8088)
server {
    listen 8088;
    server_name _;

    # Optional: Basic Auth
    # auth_basic "Alice's AI Assistant";
    # auth_basic_user_file /etc/nginx/.htpasswd-alice;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        client_max_body_size 100m;
    }
}

# Instance: bob (port 8089)
